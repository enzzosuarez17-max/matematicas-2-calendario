<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matemáticas II — Calendario</title><style>body{margin:0;background:#171717;color:#111;font-family:system-ui,sans-serif}.app{max-width:1040px;margin:0 auto;padding:14px}.head{color:#fff;text-align:center;font-size:24px;font-weight:800;margin:4px 0 14px}.controls{display:flex;justify-content:center;gap:8px;margin-bottom:10px}.btn{border:1px solid #555;background:#252525;color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}.month{color:#fff;font-weight:800;min-width:180px;text-align:center;padding:7px}.calendar{background:#fff;border-radius:8px;overflow:hidden}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{background:#f3f3f3;padding:9px 4px;text-align:center;font-size:12px;font-weight:800;color:#666;border-right:1px solid #ddd}.day{min-height:130px;border-right:1px solid #ddd;border-bottom:1px solid #ddd;padding:9px;position:relative;background:#fff}.day:nth-child(7n){border-right:0}.day.other{background:#fafafa;color:#aaa}.num{font-weight:800;font-size:13px;margin-bottom:8px}.holiday{background:#fff7d6!important;box-shadow:inset 0 0 0 3px #c6942e}.holiday .num{background:#c6942e;color:#fff;border-radius:7px;padding:5px 7px;width:max-content}.holiday-event{display:block;background:#fff0b3;color:#795800;border:1px solid #c6942e;border-radius:7px;padding:7px;font-size:11px;font-weight:900;line-height:1.25}.holiday-event small{display:block;font-size:10px;font-weight:700;margin-top:2px}@media(max-width:700px){.day{min-height:110px}.app{padding:7px}.weekdays,.days{min-width:720px}.calendar{overflow:auto}}</style></head><body><div class="app"><div class="head">📅 Calendario de estudio — Matemáticas II</div><div class="controls"><button class="btn" onclick="move(-1)">←</button><div class="month" id="month"></div><button class="btn" onclick="move(1)">→</button></div><div class="calendar"><div class="weekdays"><div class="weekday">Lun</div><div class="weekday">Mar</div><div class="weekday">Mié</div><div class="weekday">Jue</div><div class="weekday">Vie</div><div class="weekday">Sáb</div><div class="weekday">Dom</div></div><div class="days" id="days"></div></div></div><script>let view=new Date(2026,7,1);const names=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];function render(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),total=Math.ceil((start+last)/7)*7;document.getElementById('month').textContent=names[m]+' '+y;const box=document.getElementById('days');box.innerHTML='';for(let i=0;i<total;i++){let d,n,other=false;if(i<start){n=prev-start+i+1;d=new Date(y,m-1,n);other=true}else if(i>=start+last){n=i-start-last+1;d=new Date(y,m+1,n);other=true}else{n=i-start+1;d=new Date(y,m,n)}const c=document.createElement('div');c.className='day'+(other?' other':'');if(d.getFullYear()===2026&&d.getMonth()===7&&d.getDate()===17){c.classList.add('holiday');c.innerHTML='<div class="num">17</div><div class="holiday-event">🚫 FERIADO<small>No hay clases</small></div>'}else c.innerHTML='<div class="num">'+n+'</div>';box.appendChild(c)}}function move(n){view.setMonth(view.getMonth()+n);render()}render();</script></body></html>
