<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario Académico — Matemáticas II</title><style>:root{--accent:#315a9b;--bg:#101214;--line:#d9dde5;--ok:#2f6b4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#15171a;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1180px;margin:auto;padding:18px}.top{color:#fff;margin-bottom:14px}.title{font-size:26px;font-weight:850;letter-spacing:-.4px}.subtitle{font-size:12px;color:#aeb6c3;margin-top:3px}.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}.btn{border:1px solid #444b57;background:#1b1f25;color:#fff;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}.month{color:#fff;font-weight:800;min-width:190px;text-align:center}.legend{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 10px;color:#c9d0db;font-size:11px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.calendar{background:#fff;border-radius:10px;overflow:hidden}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{background:#f4f6f8;padding:9px 5px;text-align:center;font-size:11px;font-weight:850;color:#697386;border-right:1px solid #d9dde5}.day{min-height:145px;border-right:1px solid #d9dde5;border-bottom:1px solid #d9dde5;padding:8px;position:relative;background:#fff;cursor:pointer}.day:nth-child(7n){border-right:0}.day.other{background:#fafafa;color:#b2b8c2}.num{font-weight:850;font-size:12px;margin-bottom:7px}.today{box-shadow:inset 0 0 0 2px var(--accent)}.today .num{background:var(--accent);color:#fff;border-radius:6px;padding:4px 6px;width:max-content}.event{display:block;border-radius:6px;padding:6px 7px;margin:5px 0;font-size:10px;font-weight:750;line-height:1.25;border-left:4px solid}.class{background:#edf3ff;border-color:#315a9b;color:#254575}.exam{background:#fbeceb;border-color:#a33a32;color:#7b2b25}.delivery{background:#eef7f1;border-color:#2f6b4f;color:#28563f}.reminder{background:#f4efff;border-color:#7453a6;color:#573b80}.holiday{background:#fff7d6!important;box-shadow:inset 0 0 0 3px #c6942e}.holiday .num{background:#c6942e;color:#fff;border-radius:6px;padding:4px 6px;width:max-content}.holiday-event{display:block;background:#fff0b3;color:#795800;border:1px solid #c6942e;border-radius:6px;padding:7px;font-size:10px;font-weight:900;line-height:1.25}.holiday-event small{display:block;font-size:10px;font-weight:700;margin-top:2px}.attendance{font-size:9px;margin-top:4px;font-weight:800;color:var(--ok)}.modal-back{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px}.modal{width:min(520px,100%);background:#fff;border-radius:12px;padding:18px}.form{display:grid;gap:10px}.form input,.form select,.form textarea{width:100%;padding:9px;border:1px solid #ccd2dc;border-radius:7px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:8px}@media(max-width:800px){.day{min-height:120px}.weekdays,.days{min-width:760px}.calendar{overflow:auto}.row{grid-template-columns:1fr}.app{padding:9px}}</style></head><body><main class="app"><header class="top"><div class="title">📐 Matemáticas II — Calendario Académico</div><div class="subtitle">Clases, evaluaciones, entregas y seguimiento de asistencia</div></header><div class="controls"><button class="btn" onclick="move(-1)">← Anterior</button><button class="btn" onclick="today()">Hoy</button><div class="month" id="month"></div><button class="btn" onclick="move(1)">Siguiente →</button><button class="btn" onclick="openAdd()">＋ Evento</button></div><div class="legend"><span><i class="dot" style="background:#315a9b"></i>Clase</span><span><i class="dot" style="background:#a33a32"></i>Examen</span><span><i class="dot" style="background:#2f6b4f"></i>Entrega</span><span><i class="dot" style="background:#7453a6"></i>Recordatorio</span><span><i class="dot" style="background:#c6942e"></i>Feriado</span></div><section class="calendar"><div class="weekdays"><div class="weekday">LUN</div><div class="weekday">MAR</div><div class="weekday">MIÉ</div><div class="weekday">JUE</div><div class="weekday">VIE</div><div class="weekday">SÁB</div><div class="weekday">DOM</div></div><div class="days" id="days"></div></section></main><div class="modal-back" id="back"><div class="modal"><h2>Nuevo evento</h2><form class="form" onsubmit="saveEvent(event)"><input id="date" type="date" required><input id="name" placeholder="Nombre del evento" required><div class="row"><select id="type"><option value="class">Clase</option><option value="exam">Examen</option><option value="delivery">Entrega</option><option value="reminder">Recordatorio</option></select><select id="attendance"><option value="">Asistencia: sin marcar</option><option value="yes">Asistí</option><option value="no">No asistí</option></select></div><textarea id="note" rows="3" placeholder="Notas (opcional)"></textarea><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn" style="background:#315a9b" type="submit">Guardar</button></div></form></div></div><script>const KEY='matematicas2-academic-calendar-v2';let events=JSON.parse(localStorage.getItem(KEY)||'[]');let view=new Date(2026,7,1);const names=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];function iso(d){return d.toISOString().slice(0,10)}function seed(){if(!events.some(e=>e.date==='2026-08-17'&&e.type==='holiday'))events.push({date:'2026-08-17',name:'🚫 FERIADO',type:'holiday',note:'No hay clases',attendance:''});localStorage.setItem(KEY,JSON.stringify(events))}function render(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),total=Math.ceil((start+last)/7)*7;document.getElementById('month').textContent=names[m][0].toUpperCase()+names[m].slice(1)+' '+y;const box=document.getElementById('days');box.innerHTML='';for(let i=0;i<total;i++){let d,n,other=false;if(i<start){n=prev-start+i+1;d=new Date(y,m-1,n);other=true}else if(i>=start+last){n=i-start-last+1;d=new Date(y,m+1,n);other=true}else{n=i-start+1;d=new Date(y,m,n)}const c=document.createElement('div');c.className='day'+(other?' other':'');const date=iso(d);if(date===iso(new Date()))c.classList.add('today');if(date==='2026-08-17'){c.classList.add('holiday');c.innerHTML='<div class="num">17</div><div class="holiday-event">🚫 FERIADO<small>No hay clases</small></div>'}else{c.innerHTML='<div class="num">'+n+'</div>';events.filter(e=>e.date===date).forEach(e=>{const el=document.createElement('div');el.className='event '+e.type;el.textContent=e.name;if(e.attendance)el.innerHTML+='<div class="attendance">'+(e.attendance==='yes'?'✓ Asistencia registrada':'× No asistí')+'</div>';c.appendChild(el)})}c.onclick=()=>openAdd(date);box.appendChild(c)}}function move(n){view.setMonth(view.getMonth()+n);render()}function today(){view=new Date();view.setDate(1);render()}function openAdd(date){document.getElementById('back').style.display='flex';document.getElementById('date').value=date||iso(new Date());document.getElementById('name').value='';document.getElementById('type').value='class';document.getElementById('attendance').value='';document.getElementById('note').value='';document.getElementById('name').focus()}function closeModal(){document.getElementById('back').style.display='none'}function saveEvent(e){e.preventDefault();events.push({date:date.value,name:name.value,type:type.value,attendance:attendance.value,note:note.value});localStorage.setItem(KEY,JSON.stringify(events));closeModal();render()}seed();render();</script></body></html>
