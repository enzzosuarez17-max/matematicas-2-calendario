<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Matemáticas II — Calendario</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#status{position:fixed;inset:0;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#555;background:#fff}iframe{width:100%;height:100%;border:0;display:none}</style></head><body><div id="status">Cargando calendario de Matemáticas II…</div><iframe id="calendar"></iframe><script>const source='https://raw.githubusercontent.com/enzzosuarez17-max/matematicas-2-calendario/e6f1fb9ce157428b664fdc24be14cbb72542881f/index.html';fetch(source).then(r=>r.text()).then(html=>{html=html.replaceAll('Matemáticas 2','Matemáticas II').replaceAll('matematicas2_calendario_v1','matematicasII_calendario_v1').replaceAll('matematicas-2-calendario.json','matematicas-II-calendario.json');html=html.replace(':root{--bg:#f5f5f2;',':root{--bg:#ffffff;');html=html.replace('</style>','.holiday-badge{background:#fff0b3;color:#8a6500;font-weight:900;border:1px solid #c6942e}.day.holiday-day{background:#fff8e6;box-shadow:inset 0 0 0 3px #c6942e}.day.holiday-day .day-number{background:#c6942e;color:#fff}</style>');html=html.replace('</body>',`<script>if(typeof data!=='undefined'){data['2026-08-17']={holiday:true,important:true,topic:'FERIADO',note:'No hay clases.'};}if(typeof render==='function'){const oldRender=render;render=function(){oldRender();const cells=document.querySelectorAll('.day');cells.forEach(cell=>{const n=cell.querySelector('.day-number');if(n&&n.textContent.trim()==='17'&&!cell.classList.contains('other-month')){cell.classList.add('holiday-day');const c=cell.querySelector('.day-content');if(c&&!c.querySelector('.holiday-badge'))c.insertAdjacentHTML('afterbegin','<div class="badge holiday-badge">🚫 FERIADO · No hay clases</div>');}})};render();}</script></body>`);const frame=document.getElementById('calendar');frame.srcdoc=html;frame.style.display='block';document.getElementById('status').remove()}).catch(()=>document.getElementById('status').textContent='No se pudo cargar el calendario. Recargá la página.');</script></body></html>
