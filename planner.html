<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner académico</title><style>:root{--bg:#101318;--panel:#171c24;--panel2:#202732;--text:#eef2f7;--muted:#9ca6b5;--line:#303845;--accent:#6ea8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:980px;margin:auto;padding:22px}.cover{min-height:150px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(120deg,#111820,#25354a 55%,#12171e);padding:28px;display:flex;align-items:flex-end}.title{font-size:38px;font-weight:850;letter-spacing:-1px}.tag{margin-top:7px;color:#a8c8ff;font-size:13px;letter-spacing:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px}.card h2{font-size:14px;color:#86b2ff;letter-spacing:1.5px;margin:0 0 12px}.link{display:block;text-decoration:none;color:var(--text);background:var(--panel2);border:1px solid var(--line);padding:11px;border-radius:9px;margin:7px 0}.link:hover{border-color:#5577a8}.clock{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:9px}.time{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 18px;font:800 42px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--accent);min-width:105px;text-align:center}.colon{font-size:34px;color:#778396}.actions button,.ytrow button{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:10px;margin:5px 0;cursor:pointer;text-align:left}.actions button:hover,.ytrow button:hover{background:#28313d}.status{font-size:12px;color:var(--muted);margin-top:7px}.ytrow{display:flex;gap:7px}.ytrow input{flex:1;min-width:0;border:1px solid var(--line);background:#0f1319;color:#fff;border-radius:9px;padding:10px}.ytrow button{width:auto;text-align:center;background:#edf2f8;color:#111827}.note{width:100%;height:110px;resize:vertical;border:1px solid var(--line);background:#0f1319;color:#fff;border-radius:9px;padding:10px;font:inherit}.foot{grid-column:1/-1;text-align:center;color:var(--muted);font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.clock{grid-column:auto}.time{font-size:30px;min-width:75px;padding:10px 8px}}
</style></head><body><main class="wrap"><section class="cover"><div><div class="title" id="title">PLANNER ACADÉMICO</div><div class="tag">Disciplina · organización · progreso</div></div></section><div class="grid"><section class="card"><h2>NAVEGACIÓN</h2><a class="link" id="calendar">📅 Calendario de la materia</a><a class="link" id="board">✏️ Pizarra de estudio</a><a class="link" href="https://www.youtube.com/" target="_blank" rel="noopener">▶️ YouTube</a></section><section class="card actions"><h2>PROGRESO</h2><button onclick="markSession()">✓ Marcar sesión estudiada</button><button onclick="clearSession()">↺ Reiniciar estado</button><div class="status" id="status">Sin sesión registrada.</div></section><section class="clock"><div class="time" id="h">00</div><div class="colon">:</div><div class="time" id="m">00</div><div class="colon">:</div><div class="time" id="s">00</div></section><section class="card"><h2>YOUTUBE</h2><div class="ytrow"><input id="yt" placeholder="URL o búsqueda de YouTube"><button onclick="openYT()">Abrir</button></div><div class="status">Pegá una URL o escribí un tema para estudiar.</div></section><section class="card"><h2>NOTA RÁPIDA</h2><textarea id="note" class="note" placeholder="Recordatorio de estudio..."></textarea></section><div class="foot">Planner académico · funcional y adaptable a cada materia</div></div></main><script>const q=new URLSearchParams(location.search),subject=q.get('materia')||q.get('subject')||'Planner académico';document.getElementById('title').textContent=subject.toUpperCase();const files={'Contabilidad I':'contabilidad1.html','Matemáticas II':'matematicas-ii.html','Microeconomía':'microeconomia.html'};if(files[subject])document.getElementById('calendar').href='./'+files[subject];document.getElementById('board').href='./pizarra.html?materia='+encodeURIComponent(subject);const key='planner-'+subject;const status=document.getElementById('status');const saved=localStorage.getItem(key);if(saved)status.textContent='Última sesión: '+new Date(saved).toLocaleString('es-AR');function markSession(){let now=new Date().toISOString();localStorage.setItem(key,now);status.textContent='Última sesión: '+new Date(now).toLocaleString('es-AR')}function clearSession(){localStorage.removeItem(key);status.textContent='Sin sesión registrada.'}function openYT(){let v=document.getElementById('yt').value.trim();if(!v)return;window.open(v.startsWith('http')?v:'https://www.youtube.com/results?search_query='+encodeURIComponent(v),'_blank','noopener')}function tick(){let d=new Date(),h=d.getHours()%12||12;document.getElementById('h').textContent=String(h).padStart(2,'0');document.getElementById('m').textContent=String(d.getMinutes()).padStart(2,'0');document.getElementById('s').textContent=String(d.getSeconds()).padStart(2,'0')}tick();setInterval(tick,1000);</script></body></html>
