<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario Académico — Microeconomía</title>
<style>
:root{--accent:#315a9b;--bg:#0f1114;--panel:#171a1f;--line:#d8dde6;--muted:#687386;--exam:#a33a32;--delivery:#2f6b4f;--reminder:#7453a6;--holiday:#b17b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17191c}.app{max-width:1220px;margin:auto;padding:18px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:14px;color:#fff}.title{font-size:27px;font-weight:850;letter-spacing:-.5px}.subtitle{margin-top:4px;color:#aeb7c5;font-size:12px}.controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}.btn{border:1px solid #444b56;background:#1b1f25;color:#fff;border-radius:8px;padding:8px 12px;font-weight:750;cursor:pointer}.btn:hover{background:#272d36}.month{min-width:210px;text-align:center;color:#fff;font-weight:850}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:var(--panel);border:1px solid #292e36;border-radius:9px;padding:9px 11px;color:#fff}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:#aeb7c5}.legend{display:flex;gap:12px;flex-wrap:wrap;color:#cbd2dd;font-size:11px;margin:0 0 10px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.calendar{background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 12px 38px #0005}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{background:#f3f5f8;color:#657083;padding:9px 5px;text-align:center;font-size:11px;font-weight:850;border-right:1px solid var(--line)}.day{min-height:145px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;cursor:pointer}.day:hover{background:#fafcff}.day:nth-child(7n){border-right:0}.day.other{background:#fafafa;color:#b1b8c2}.num{font-size:12px;font-weight:850;margin-bottom:7px}.today{box-shadow:inset 0 0 0 2px var(--accent)}.today .num{display:inline-block;background:var(--accent);color:#fff;padding:4px 6px;border-radius:6px}.event{display:block;border-left:4px solid;border-radius:6px;padding:6px 7px;margin:5px 0;font-size:10px;font-weight:750;line-height:1.25}.class{background:#edf3ff;border-color:var(--accent);color:#254575}.exam{background:#fbeceb;border-color:var(--exam);color:#7b2b25}.delivery{background:#eef7f1;border-color:var(--delivery);color:#28563f}.reminder{background:#f4efff;border-color:var(--reminder);color:#573b80}.holiday{background:#fff8dc!important;box-shadow:inset 0 0 0 3px #c6942e}.holiday .num{display:inline-block;background:#c6942e;color:#fff;padding:4px 6px;border-radius:6px}.holiday-event{display:block;background:#fff0b3;border:1px solid #c6942e;color:#765700;border-radius:6px;padding:7px;font-size:10px;font-weight:900}.holiday-event small{display:block;margin-top:2px;font-size:10px;font-weight:700}.attendance{margin-top:4px;font-size:9px;font-weight:850}.yes{color:var(--delivery)}.no{color:var(--exam)}.modal-back{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px}.modal{width:min(540px,100%);background:#fff;border-radius:12px;padding:18px;box-shadow:0 20px 70px #0008}.modal h2{margin:0 0 12px}.form{display:grid;gap:10px}.form input,.form select,.form textarea{width:100%;padding:9px;border:1px solid #cbd2dc;border-radius:7px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:8px}.primary{background:var(--accent)!important}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.weekdays,.days{min-width:780px}.calendar{overflow:auto}.row{grid-template-columns:1fr}.app{padding:9px}.top{display:block}}
</style></head>
<body><main class="app"><header class="top"><div><div class="title">📊 Microeconomía</div><div class="subtitle">Calendario académico · clases · evaluaciones · entregas · asistencia</div></div></header><div class="controls"><button class="btn" onclick="move(-1)">← Anterior</button><button class="btn" onclick="goToday()">Hoy</button><div class="month" id="month"></div><button class="btn" onclick="move(1)">Siguiente →</button><button class="btn" onclick="openAdd()">＋ Evento</button></div><div class="stats"><div class="stat"><b id="sClasses">0</b><span>Clases registradas</span></div><div class="stat"><b id="sExams">0</b><span>Evaluaciones</span></div><div class="stat"><b id="sDeliveries">0</b><span>Entregas</span></div><div class="stat"><b id="sAttendance">—</b><span>Asistencia registrada</span></div></div><div class="legend"><span><i class="dot" style="background:#315a9b"></i>Clase</span><span><i class="dot" style="background:#a33a32"></i>Examen</span><span><i class="dot" style="background:#2f6b4f"></i>Entrega</span><span><i class="dot" style="background:#7453a6"></i>Recordatorio</span><span><i class="dot" style="background:#b17b00"></i>Feriado</span></div><section class="calendar"><div class="weekdays"><div class="weekday">LUN</div><div class="weekday">MAR</div><div class="weekday">MIÉ</div><div class="weekday">JUE</div><div class="weekday">VIE</div><div class="weekday">SÁB</div><div class="weekday">DOM</div></div><div class="days" id="days"></div></section></main><div class="modal-back" id="back"><div class="modal"><h2>Agregar evento académico</h2><form class="form" onsubmit="saveEvent(event)"><input id="date" type="date" required><input id="name" placeholder="Ej.: Clase teórica, Parcial 1, TP 2..." required><div class="row"><select id="type"><option value="class">Clase</option><option value="exam">Examen</option><option value="delivery">Entrega</option><option value="reminder">Recordatorio</option></select><select id="attendance"><option value="">Asistencia: sin marcar</option><option value="yes">✓ Asistí</option><option value="no">× No asistí</option></select></div><textarea id="note" rows="3" placeholder="Notas académicas (opcional)"></textarea><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" type="submit">Guardar evento</button></div></form></div></div><script>const KEY='microeconomia-academic-calendar-v3';let events=JSON.parse(localStorage.getItem(KEY)||'[]');let view=new Date(2026,7,1);const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function seed(){if(!events.some(e=>e.date==='2026-08-17'&&e.type==='holiday'))events.push({date:'2026-08-17',name:'🚫 FERIADO',type:'holiday',note:'No hay clases',attendance:''});localStorage.setItem(KEY,JSON.stringify(events))}function render(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),total=Math.ceil((start+last)/7)*7;document.getElementById('month').textContent=months[m][0].toUpperCase()+months[m].slice(1)+' '+y;const box=document.getElementById('days');box.innerHTML='';for(let i=0;i<total;i++){let d,n,other=false;if(i<start){n=prev-start+i+1;d=new Date(y,m-1,n);other=true}else if(i>=start+last){n=i-start-last+1;d=new Date(y,m+1,n);other=true}else{n=i-start+1;d=new Date(y,m,n)}const c=document.createElement('div');c.className='day'+(other?' other':'');const date=iso(d);if(date===iso(new Date()))c.classList.add('today');if(date==='2026-08-17'){c.classList.add('holiday');c.innerHTML='<div class="num">17</div><div class="holiday-event">🚫 FERIADO<small>No hay clases</small></div>'}else{c.innerHTML='<div class="num">'+n+'</div>';events.filter(e=>e.date===date).forEach(e=>{const el=document.createElement('div');el.className='event '+e.type;el.innerHTML=e.name+(e.attendance?'<div class="attendance '+(e.attendance==='yes'?'yes':'no')+'">'+(e.attendance==='yes'?'✓ Asistí':'× No asistí')+'</div>':'');c.appendChild(el)})}c.onclick=()=>openAdd(date);box.appendChild(c)}updateStats()}function updateStats(){document.getElementById('sClasses').textContent=events.filter(e=>e.type==='class').length;document.getElementById('sExams').textContent=events.filter(e=>e.type==='exam').length;document.getElementById('sDeliveries').textContent=events.filter(e=>e.type==='delivery').length;const a=events.filter(e=>e.attendance);const yes=a.filter(e=>e.attendance==='yes').length;document.getElementById('sAttendance').textContent=a.length?Math.round(yes/a.length*100)+'%':'—'}function move(n){view.setMonth(view.getMonth()+n);render()}function goToday(){view=new Date();view.setDate(1);render()}function openAdd(date){back.style.display='flex';document.getElementById('date').value=date||iso(new Date());name.value='';type.value='class';attendance.value='';note.value='';name.focus()}function closeModal(){back.style.display='none'}function saveEvent(e){e.preventDefault();events.push({date:date.value,name:name.value,type:type.value,attendance:attendance.value,note:note.value});localStorage.setItem(KEY,JSON.stringify(events));closeModal();render()}seed();render();</script></body></html>
