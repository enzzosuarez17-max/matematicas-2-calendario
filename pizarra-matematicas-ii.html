<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizarra Matemáticas II</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fff;color:#222}.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid #ddd;background:#fff}.bar strong{margin-right:auto}.btn{border:1px solid #ccc;background:#fff;border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer}.btn.active{background:#596b9d;color:#fff;border-color:#596b9d}.wrap{padding:12px}.board{position:relative;width:100%;height:min(72vh,720px);min-height:420px;border:1px solid #ddd;border-radius:14px;overflow:hidden;background:#fff;touch-action:none}.board canvas{display:block;width:100%;height:100%}.upload{display:none}.bottom{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hint{font-size:12px;color:#777;margin-top:8px}.preview{display:none;margin-top:12px;border:1px solid #ddd;border-radius:12px;padding:10px}.preview img{max-width:100%;display:block}.status{font-size:12px;color:#666}.red{color:#c62828}
</style></head><body>
<div class="bar"><strong>✏️ Pizarra — Matemáticas II</strong><button class="btn active" id="pen">✎ Dibujar</button><button class="btn" id="eraser">⌫ Borrar</button><button class="btn" id="clear">Limpiar</button><label class="btn">📷 Subir imagen<input class="upload" id="file" type="file" accept="image/*"></label><button class="btn" id="save">💾 Guardar imagen</button></div>
<div class="wrap"><div class="board" id="board"><canvas id="canvas"></canvas></div><div class="bottom"><span class="status" id="status">Dibujá o subí una foto de tu ejercicio.</span></div><div class="hint">Para que yo pueda leerlo: guardá la imagen y subila directamente al chat. El navegador no puede enviar automáticamente un dibujo nuevo a GitHub sin una autenticación segura.</div><div class="preview" id="preview"><div><b>Vista guardada</b></div><img id="previewImg"></div></div>
<script>
const board=document.getElementById('board'),c=document.getElementById('canvas'),ctx=c.getContext('2d');let drawing=false,mode='pen',lastX=0,lastY=0;
function resize(preserve=true){const old=preserve&&c.width?c.toDataURL() : null;const r=board.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);c.style.width=r.width+'px';c.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=3;ctx.strokeStyle='#222';if(old){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=old}}
addEventListener('resize',()=>resize(true));resize(false);
function pos(e){const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
board.addEventListener('pointerdown',e=>{drawing=true;board.setPointerCapture(e.pointerId);[lastX,lastY]=pos(e);});board.addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=pos(e);ctx.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';ctx.lineWidth=mode==='eraser'?24:3;ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke();lastX=x;lastY=y});board.addEventListener('pointerup',()=>drawing=false);board.addEventListener('pointercancel',()=>drawing=false);
function active(m){mode=m;document.getElementById('pen').classList.toggle('active',m==='pen');document.getElementById('eraser').classList.toggle('active',m==='eraser')};document.getElementById('pen').onclick=()=>active('pen');document.getElementById('eraser').onclick=()=>active('eraser');document.getElementById('clear').onclick=()=>{if(confirm('¿Limpiar toda la pizarra?')){ctx.clearRect(0,0,c.width,c.height);document.getElementById('preview').style.display='none'}};
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const r=board.getBoundingClientRect();ctx.clearRect(0,0,c.width,c.height);const scale=Math.min(r.width/im.width,r.height/im.height);const w=im.width*scale,h=im.height*scale;ctx.drawImage(im,(r.width-w)/2,(r.height-h)/2,w,h);URL.revokeObjectURL(im.src);document.getElementById('status').textContent='Imagen cargada. Podés escribir encima.'};im.src=URL.createObjectURL(f)};
document.getElementById('save').onclick=()=>{const r=board.getBoundingClientRect();const out=document.createElement('canvas');out.width=Math.round(r.width*2);out.height=Math.round(r.height*2);const o=out.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,out.width,out.height);o.drawImage(c,0,0,out.width,out.height);const url=out.toDataURL('image/png');const a=document.createElement('a');a.href=url;a.download='ejercicio-matematicas-ii.png';a.click();document.getElementById('previewImg').src=url;document.getElementById('preview').style.display='block';document.getElementById('status').textContent='Imagen guardada. Subila al chat para que pueda leerla.'};
</script></body></html>
