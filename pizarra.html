<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pizarra Académica</title><style>body{margin:0;background:#0d1015;color:#fff;font-family:Inter,system-ui,sans-serif}.bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap;background:#171b22;position:sticky;top:0;z-index:2}button,input{padding:9px;border-radius:7px;border:1px solid #444b56;background:#20252d;color:#fff}canvas{display:block;background:#fff;width:100%;height:calc(100vh - 70px);touch-action:none}</style></head><body><div class="bar"><button onclick="tool='pen'">✏️ Lápiz</button><button onclick="tool='eraser'">🧽 Goma</button><button onclick="undo()">↶ Deshacer</button><button onclick="clearAll()">🗑️ Limpiar</button><input type="file" id="file" accept="image/*"><button onclick="save()">💾 Guardar PNG</button></div><canvas id="c"></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');let tool='pen',down=false,last=null,history=[];function resize(){const r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height)}resize();addEventListener('resize',resize);function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.onpointerdown=e=>{history.push(c.toDataURL());down=true;last=pos(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;let p=pos(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.lineWidth=tool==='eraser'?25:3;x.lineCap='round';x.strokeStyle=tool==='eraser'?'#fff':'#18212f';x.stroke();last=p};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false;function undo(){let s=history.pop();if(!s)return;let im=new Image;im.onload=()=>x.drawImage(im,0,0,c.width/devicePixelRatio,c.height/devicePixelRatio);im.src=s}function clearAll(){history.push(c.toDataURL());x.fillStyle='#fff';x.fillRect(0,0,c.width/devicePixelRatio,c.height/devicePixelRatio)}file.onchange=e=>{let f=e.target.files[0];if(!f)return;let im=new Image;im.onload=()=>{history.push(c.toDataURL());x.drawImage(im,0,0,c.width/devicePixelRatio,c.height/devicePixelRatio)};im.src=URL.createObjectURL(f)}function save(){let a=document.createElement('a');a.download='pizarra-'+Date.now()+'.png';a.href=c.toDataURL('image/png');a.click()}</script></body></html>
