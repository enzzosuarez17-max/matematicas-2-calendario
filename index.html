<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contabilidad 1 — Calendario</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#status{position:fixed;inset:0;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#555;background:#f5f5f2}iframe{width:100%;height:100%;border:0;display:none}</style>
</head>
<body>
<div id="status">Cargando calendario de Contabilidad 1…</div>
<iframe id="calendar"></iframe>
<script>
const source='https://raw.githubusercontent.com/enzzosuarez17-max/matematicas-2-calendario/e6f1fb9ce157428b664fdc24be14cbb72542881f/index.html';
fetch(source).then(r=>r.text()).then(html=>{
  html=html.replaceAll('Matemáticas 2','Contabilidad 1')
           .replaceAll('matematicas2_calendario_v1','contabilidad1_calendario_v1')
           .replaceAll('matematicas-2-calendario.json','contabilidad-1-calendario.json');
  const frame=document.getElementById('calendar');
  frame.srcdoc=html;
  frame.style.display='block';
  document.getElementById('status').remove();
}).catch(()=>{
  document.getElementById('status').textContent='No se pudo cargar el calendario. Recargá la página.';
});
</script>
</body>
</html>
