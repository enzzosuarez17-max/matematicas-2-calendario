<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Contabilidad 1 — Calendario</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#status{position:fixed;inset:0;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#555}iframe{width:100%;height:100%;border:0;display:none}</style></head><body><div id="status">Cargando calendario de Contabilidad 1…</div><iframe id="calendar"></iframe><script>const source='https://raw.githubusercontent.com/enzzosuarez17-max/matematicas-2-calendario/e6f1fb9ce157428b664fdc24be14cbb72542881f/index.html';fetch(source).then(r=>r.text()).then(html=>{html=html.replaceAll('Matemáticas 2','Contabilidad 1').replaceAll('matematicas2_calendario_v1','contabilidad1_calendario_v1').replaceAll('matematicas-2-calendario.json','contabilidad-1-calendario.json');const inject=`<style>.holiday-day{background:#fff3cd!important;box-shadow:inset 0 0 0 3px #c6942e!important}.holiday-day .day-number{background:#c6942e!important;color:#fff!important}.holiday-badge{display:block!important;background:#fff0b3;color:#8a6500;font-weight:900;border-radius:7px;padding:6px 8px;font-size:11px;margin-top:5px}</style><script>(function(){function markHoliday(){const title=document.querySelector('.month-title');if(!title||!title.textContent.toLowerCase().includes('agosto 2026'))return;document.querySelectorAll('.holiday-day').forEach(x=>x.classList.remove('holiday-day'));document.querySelectorAll('.holiday-badge').forEach(x=>x.remove());document.querySelectorAll('.day').forEach(function(cell){const n=cell.querySelector('.day-number');if(n&&n.textContent.trim()==='17'&&!cell.classList.contains('other-month')){cell.classList.add('holiday-day');const c=cell.querySelector('.day-content');if(c){const b=document.createElement('div');b.className='badge holiday-badge';b.textContent='🚫 FERIADO · No hay clases';c.prepend(b)}}})}new MutationObserver(markHoliday).observe(document.body,{subtree:true,childList:true});setInterval(markHoliday,300);markHoliday()})()<\/script>`;html=html.replace('</body>',inject+'</body>');document.getElementById('calendar').srcdoc=html;document.getElementById('calendar').style.display='block';document.getElementById('status').remove()}).catch(()=>{document.getElementById('status').textContent='No se pudo cargar el calendario. Recargá la página.'});</script></body></html>
