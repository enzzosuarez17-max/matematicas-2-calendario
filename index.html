<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Matemáticas 2 — Calendario</title>
<style>
:root{--bg:#f5f5f2;--panel:#fff;--panel2:#fafaf8;--text:#252525;--muted:#777;--border:#deded8;--accent:#596b9d;--accent-soft:#e8ecf6;--done:#4f8a62;--done-soft:#e4f1e7;--pending:#b85c5c;--pending-soft:#f7e5e5;--practice:#c6942e;--practice-soft:#fbf1d8;--exam:#755ca8;--exam-soft:#eee8f7;--radius:14px;--shadow:0 8px 30px rgba(0,0,0,.06)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,rgba(89,107,157,.08),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{width:min(1500px,calc(100% - 32px));margin:24px auto}.header,.calendar{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.header{padding:24px;margin-bottom:18px}.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}h1{margin:0;font-size:clamp(25px,4vw,38px);letter-spacing:-.035em}.subtitle{margin:7px 0 0;color:var(--muted);font-size:14px}.header-actions,.legend,.month-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 13px;font-weight:700;font-size:13px}.btn:hover{background:var(--panel2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:var(--pending)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px}.stat{border:1px solid var(--border);background:var(--panel2);border-radius:12px;padding:13px}.stat-label{color:var(--muted);font-size:12px;margin-bottom:5px}.stat-value{font-size:23px;font-weight:850}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.month-title{min-width:210px;text-align:center;font-weight:850;font-size:21px;text-transform:capitalize}.legend-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--border);padding:7px 9px;border-radius:999px}.dot{width:8px;height:8px;border-radius:50%}.dot.done{background:var(--done)}.dot.pending{background:var(--pending)}.dot.practice{background:var(--practice)}.dot.exam{background:var(--exam)}.calendar{overflow:hidden}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);background:var(--panel2)}.weekday{padding:11px 8px;text-align:center;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase}.days{display:grid;grid-template-columns:repeat(7,1fr)}.day{min-height:155px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:10px;position:relative;background:var(--panel);transition:background .15s}.day:nth-child(7n){border-right:0}.day:hover{background:#fcfcfa}.day.other-month{opacity:.38;background:#f8f8f6}.day.today{box-shadow:inset 0 0 0 2px var(--accent)}.day-number{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;font-weight:850;font-size:13px;margin-bottom:7px}.today .day-number{background:var(--accent);color:white}.day-content{display:flex;flex-direction:column;gap:5px}.badge{width:fit-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:800;border-radius:7px;padding:5px 7px}.badge.done{background:var(--done-soft);color:var(--done)}.badge.pending{background:var(--pending-soft);color:var(--pending)}.badge.practice{background:var(--practice-soft);color:#936d17}.badge.exam{background:var(--exam-soft);color:var(--exam)}.topic{font-size:11px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.source{color:var(--muted);font-size:10px}.day-menu{position:absolute;top:8px;right:8px;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:3px}.overlay{position:fixed;inset:0;background:rgba(20,20,18,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;backdrop-filter:blur(5px)}.overlay.open{display:flex}.modal{width:min(620px,100%);max-height:min(820px,calc(100vh - 40px));overflow-y:auto;background:var(--panel);border-radius:18px;border:1px solid var(--border);box-shadow:0 25px 80px rgba(0,0,0,.18);padding:22px}.modal-header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.modal-title{font-size:21px;font-weight:850}.close{border:0;background:transparent;font-size:24px;color:var(--muted)}.form-group{margin-bottom:15px}label{display:block;margin-bottom:6px;font-size:12px;font-weight:800;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 11px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}textarea{resize:vertical;min-height:90px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.attendance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.attendance button{padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);font-weight:800}.attendance button.selected.done{background:var(--done-soft);border-color:var(--done);color:var(--done)}.attendance button.selected.practice{background:var(--practice-soft);border-color:var(--practice);color:#936d17}.attendance button.selected.pending{background:var(--pending-soft);border-color:var(--pending);color:var(--pending)}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid var(--border);background:var(--panel2);border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750}.check input{width:auto}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.day{min-height:125px}}@media(max-width:650px){.app{width:calc(100% - 14px);margin:7px auto}.header{padding:17px}.header-top{flex-direction:column}.calendar{overflow-x:auto}.weekdays,.days{min-width:760px}.stats{grid-template-columns:repeat(2,1fr)}.day{min-height:130px}}
</style></head><body>
<div class="app"><section class="header"><div class="header-top"><div><div class="eyebrow">Universidad · FCE · UNC</div><h1>Matemáticas 2</h1><p class="subtitle">Calendario de cursado · temas · ejercicios · fuentes · páginas · progreso</p></div><div class="header-actions"><button class="btn" onclick="goToday()">Hoy</button><button class="btn" onclick="exportData()">Exportar</button><button class="btn danger" onclick="clearAll()">Borrar datos</button></div></div><div class="stats"><div class="stat"><div class="stat-label">Clases registradas</div><div class="stat-value" id="classCount">0</div></div><div class="stat"><div class="stat-label">Dominados</div><div class="stat-value" id="doneCount">0</div></div><div class="stat"><div class="stat-label">Practicando</div><div class="stat-value" id="practiceCount">0</div></div><div class="stat"><div class="stat-label">Pendientes</div><div class="stat-value" id="pendingCount">0</div></div><div class="stat"><div class="stat-label">Parciales / finales</div><div class="stat-value" id="examCount">0</div></div></div></section>
<div class="toolbar"><div class="month-controls"><button class="btn" onclick="changeMonth(-1)">←</button><div class="month-title" id="monthTitle"></div><button class="btn" onclick="changeMonth(1)">→</button></div><div class="legend"><span class="legend-item"><span class="dot done"></span>Dominado</span><span class="legend-item"><span class="dot practice"></span>Practicando</span><span class="legend-item"><span class="dot pending"></span>Pendiente</span><span class="legend-item"><span class="dot exam"></span>Parcial / final</span></div></div>
<section class="calendar"><div class="weekdays"><div class="weekday">Lun</div><div class="weekday">Mar</div><div class="weekday">Mié</div><div class="weekday">Jue</div><div class="weekday">Vie</div><div class="weekday">Sáb</div><div class="weekday">Dom</div></div><div class="days" id="days"></div></section></div>
<div class="overlay" id="overlay"><div class="modal"><div class="modal-header"><div class="modal-title" id="modalTitle">Día</div><button class="close" onclick="closeModal()">×</button></div><div class="form-group"><label>Estado del estudio</label><div class="attendance"><button id="doneBtn" class="done" onclick="setStatus('done')">✓ Dominado</button><button id="practiceBtn" class="practice" onclick="setStatus('practice')">◐ Practicando</button><button id="pendingBtn" class="pending" onclick="setStatus('pending')">× Pendiente</button></div></div><div class="grid2"><div class="form-group"><label for="typeInput">Tipo de contenido</label><select id="typeInput"><option value="">Seleccionar...</option><option>Límites</option><option>Continuidad</option><option>Derivadas</option><option>Aplicaciones de derivadas</option><option>Integrales</option><option>Aplicaciones de integrales</option><option>Sucesiones</option><option>Series</option><option>Otro</option></select></div><div class="form-group"><label for="topicInput">Tema</label><input id="topicInput" placeholder="Ej.: Límites notables"></div></div><div class="grid2"><div class="form-group"><label for="sourceInput">Fuente</label><input id="sourceInput" placeholder="Nombre exacto del PDF / apunte"></div><div class="form-group"><label for="pageInput">Página</label><input id="pageInput" placeholder="Ej.: 37"></div></div><div class="form-group"><label for="exerciseInput">Ejercicio</label><textarea id="exerciseInput" placeholder="Escribí el ejercicio o una referencia breve."></textarea></div><div class="form-group"><label for="noteInput">Notas de la clase</label><textarea id="noteInput" placeholder="Explicación, dudas, errores, procedimiento..."></textarea></div><div class="checks"><label class="check"><input type="checkbox" id="importantInput">⭐ Concepto importante</label><label class="check"><input type="checkbox" id="examInput">🧾 Parcial / final</label></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveDay()">Guardar</button></div></div></div>
<script>
const STORAGE_KEY='matematicas2_calendario_v1';let data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'),currentDate=new Date(),selectedKey=null;const monthNames=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function formatDate(d){return d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function saveStorage(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function render(){let y=currentDate.getFullYear(),m=currentDate.getMonth();document.getElementById('monthTitle').textContent=`${monthNames[m]} ${y}`;let days=document.getElementById('days');days.innerHTML='';let first=new Date(y,m,1),start=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),pdim=new Date(y,m,0).getDate(),total=Math.ceil((start+dim)/7)*7;for(let i=0;i<total;i++){let n,d,other=false;if(i<start){n=pdim-start+i+1;d=new Date(y,m-1,n);other=true}else if(i>=start+dim){n=i-start-dim+1;d=new Date(y,m+1,n);other=true}else{n=i-start+1;d=new Date(y,m,n)}let key=dateKey(d),item=data[key]||{},cell=document.createElement('div');cell.className='day'+(other?' other-month':'');if(key===dateKey(new Date()))cell.classList.add('today');let num=document.createElement('div');num.className='day-number';num.textContent=n;let content=document.createElement('div');content.className='day-content';if(item.status)content.innerHTML+=`<div class="badge ${item.status}">${item.status==='done'?'✓ Dominado':item.status==='practice'?'◐ Practicando':'× Pendiente'}</div>`;if(item.exam)content.innerHTML+='<div class="badge exam">🧾 Parcial / final</div>';if(item.important)content.innerHTML+='<div class="badge practice">⭐ Importante</div>';if(item.type)content.innerHTML+=`<div class="source">${item.type}</div>`;if(item.topic){let t=document.createElement('div');t.className='topic';t.textContent=item.topic;content.appendChild(t)}if(item.source){let s=document.createElement('div');s.className='source';s.textContent='📖 '+item.source+(item.page?' · pág. '+item.page:'');content.appendChild(s)}let menu=document.createElement('button');menu.className='day-menu';menu.textContent='⋯';menu.onclick=e=>{e.stopPropagation();openModal(d)};cell.append(num,content,menu);cell.onclick=()=>openModal(d);days.appendChild(cell)}updateStats()}
function openModal(d){selectedKey=dateKey(d);let i=data[selectedKey]||{};document.getElementById('modalTitle').textContent=formatDate(d);document.getElementById('typeInput').value=i.type||'';document.getElementById('topicInput').value=i.topic||'';document.getElementById('sourceInput').value=i.source||'';document.getElementById('pageInput').value=i.page||'';document.getElementById('exerciseInput').value=i.exercise||'';document.getElementById('noteInput').value=i.note||'';document.getElementById('importantInput').checked=!!i.important;document.getElementById('examInput').checked=!!i.exam;['done','practice','pending'].forEach(s=>document.getElementById(s+'Btn').classList.toggle('selected',i.status===s));document.getElementById('overlay').classList.add('open')}function closeModal(){document.getElementById('overlay').classList.remove('open');selectedKey=null}function setStatus(v){if(!selectedKey)return;if(!data[selectedKey])data[selectedKey]={};data[selectedKey].status=v;['done','practice','pending'].forEach(s=>document.getElementById(s+'Btn').classList.toggle('selected',s===v))}
function saveDay(){if(!selectedKey)return;if(!data[selectedKey])data[selectedKey]={};let i=data[selectedKey];i.type=document.getElementById('typeInput').value;i.topic=document.getElementById('topicInput').value.trim();i.source=document.getElementById('sourceInput').value.trim();i.page=document.getElementById('pageInput').value.trim();i.exercise=document.getElementById('exerciseInput').value.trim();i.note=document.getElementById('noteInput').value.trim();i.important=document.getElementById('importantInput').checked;i.exam=document.getElementById('examInput').checked;if(!i.type&&!i.topic&&!i.source&&!i.page&&!i.exercise&&!i.note&&!i.important&&!i.exam&&!i.status)delete data[selectedKey];saveStorage();closeModal();render()}function changeMonth(a){currentDate.setMonth(currentDate.getMonth()+a);render()}function goToday(){currentDate=new Date();render()}function updateStats(){let c=0,d=0,p=0,pe=0,e=0;Object.values(data).forEach(i=>{if(i.topic||i.type||i.exercise||i.note||i.source)c++;if(i.status==='done')d++;if(i.status==='practice')p++;if(i.status==='pending')pe++;if(i.exam)e++});document.getElementById('classCount').textContent=c;document.getElementById('doneCount').textContent=d;document.getElementById('practiceCount').textContent=p;document.getElementById('pendingCount').textContent=pe;document.getElementById('examCount').textContent=e}function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='matematicas-2-calendario.json';a.click();URL.revokeObjectURL(u)}function clearAll(){if(confirm('¿Querés borrar todos los datos de Matemáticas 2?')){data={};saveStorage();render()}}document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(!document.getElementById('overlay').classList.contains('open')){if(e.key==='ArrowLeft')changeMonth(-1);if(e.key==='ArrowRight')changeMonth(1)}});render();
</script></body></html>
