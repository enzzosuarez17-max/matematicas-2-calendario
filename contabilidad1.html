<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario Académico — Contabilidad I</title><style>body{margin:0;background:#0d1015;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{padding:20px;max-width:1220px;margin:auto}.card{background:#fff;color:#17191c;border-radius:12px;overflow:hidden}.h{background:#18283c;color:white;padding:20px}.days{display:grid;grid-template-columns:repeat(7,1fr)}.w{background:#f3f5f8;padding:10px;text-align:center;font-weight:800}.d{min-height:110px;padding:8px;border:1px solid #ddd}.holiday{background:#fff8dc}.event{margin:4px 0;padding:6px;border-left:4px solid #315a9b;background:#edf3ff;font-size:11px}</style></head><body><div class="wrap"><div class="h"><h1>Contabilidad I</h1></div><div class="card"><div class="days">${'<div class="w">LUN</div><div class="w">MAR</div><div class="w">MIÉ</div><div class="w">JUE</div><div class="w">VIE</div><div class="w">SÁB</div><div class="w">DOM</div>'}</div><div id="days" class="days"></div></div></div><script>let d=document.getElementById('days');let y=2026,m=7,first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate();for(let i=0;i<start;i++)d.innerHTML+='<div class="d"></div>';for(let n=1;n<=last;n++){let x=document.createElement('div');x.className='d';x.innerHTML='<b>'+n+'</b>';if(n===17){x.className+=' holiday';x.innerHTML+='<div class="event">🚫 FERIADO<br><small>No hay clases</small></div>'}d.appendChild(x)}</script></body></html>
